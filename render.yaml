services:
  - type: web
    name: cubelelo-price-tracker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /tmp/cubelelo_data
    healthCheckPath: /api/health
